services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agrios
      POSTGRES_PASSWORD: agrios
      POSTGRES_DB: agrios
    ports:
      - '5432:5432'
    volumes:
      - agrios-data:/var/lib/postgresql/data
      - ./scripts/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrios']
      interval: 5s
      retries: 10

volumes:
  agrios-data:
